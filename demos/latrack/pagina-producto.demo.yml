# yaml-language-server: $schema=../../plugins/demofed/skills/demofed/templates/demo.schema.json
id: pagina-producto
product: Latrack
archetype: custom
title: Lo que ve una radio que llega a Latrack por primera vez
titleCard: false
promise: >
  El dueño de una radio entiende en un minuto las dos formas de estar en el celular, su app
  propia o Latrack desde hoy, qué hace falta para empezar, cuánto cuesta y cómo pedir la demo.

intake:
  audience: equipo interno y clientes evaluando Latrack (efetrack)
  in:
    - La portada con la app de ejemplo en el teléfono
    - Los dos modelos, app propia o Latrack, y que se pueden tener los dos
    - Lo que hace falta para empezar (stream, logo, programación)
    - Precios sin contrato, y la pregunta de la app con el nombre de la radio
    - El formulario para pedir la demo (sin enviarlo)
  out:
    - Enviar el formulario (crea un pedido de demo y avisa a ventas; lo muestra puesta-en-marcha)
    - El resto del día al aire y de las preguntas frecuentes
    - El sitio web y el reproductor (tiene su video, reproductor-web) y lo que llega próximamente (CarPlay / Android Auto)
  environment: >
    QA (https://qa-latrack.adavance.com), página pública /producto, sin sesión. No se
    siembra ni se crea nada; el formulario se completa pero no se envía.
  approved_by: Federico

viewport: desktop
locale: es-US
timezone: America/Chicago
narration: true
pace: medium
captions: false
chapter: { position: top-right, top: 48 }

cast:
  - as: prospecto
    name: Jorge Villarreal
    context: Dueño de dos FM regionales en el Valle de Texas. Quiere a su radio en el celular.

world:
  seed: ./seeds/pagina-producto.mjs

scenes:
  - id: portada
    title: "Tu radio en el celular, con tu marca"
    proves: La portada muestra la app de una radio de ejemplo y las dos formas de llegar al teléfono.
    covers: [pagina-producto]
    watch: El teléfono es la vista real de la app de ejemplo, La Brisa 101.1.
    beats:
      - as: prospecto
        go: /producto
        awaits: producto-telefono
        say: Jorge tiene dos radios en Texas y llega a la página de Latrack.
        voice: Jorge tiene dos radios en Tejas y llega a la página de Latrack.
      - highlight: producto-telefono
        say: Lo primero que ve es una radio de ejemplo en un teléfono, con su marca.

  - id: modelos
    title: "Tu app propia, o tu radio en Latrack"
    proves: Los dos modelos, app propia publicada desde las cuentas de la radio o Latrack desde el primer día, y los dos a la vez.
    covers: [dos-modelos, pagina-producto]
    watch: Las dos conviven; el link y el QR llevan a cada oyente a la app que corresponde.
    beats:
      - scroll: producto-modelos
      - highlight: producto-modelo-propia
        say: Puede tener su propia app en las tiendas, con su nombre y su ícono…
      - highlight: producto-modelo-latrack
        say: …o estar en Latrack desde el primer día, sin cuentas de tienda. O las dos.
      - highlight: producto-empezar
        say: Para empezar alcanza con su stream, su logo y su programación.
        voice: Para empezar alcanza con su estrím, su logo y su programación.

  - id: precios
    title: "Un precio por mes, y la app con su nombre"
    objection: true
    proves: Precios publicados sin contrato, y la respuesta honesta sobre la app con el nombre de la radio.
    covers: [pagina-producto]
    watch: La respuesta explica por qué la app propia se publica desde las cuentas de la radio.
    beats:
      - scroll: producto-precios
        say: Los precios están a la vista, por mes y sin contrato.
      - click: producto-app-nombre
        awaits: producto-app-nombre-resp
      # A scroll forces a full repaint: in the screencast the rows under the opened answer
      # kept their old paint and overlapped.
      - scroll: producto-app-nombre-resp
        say: Y la app con su nombre sale desde sus cuentas; mientras tanto, ya está en Latrack.

  - id: demo
    title: "Pide la demo con su propia radio"
    proves: Formulario corto para pedir una demo con la radio del prospecto.
    covers: [pagina-producto]
    watch: El formulario no se envía en este video.
    hold: 2s
    beats:
      - scroll: producto-volver-demo
        say: Al final, pide una demo con su propia radio.
      - type: { target: demo-nombre, text: "Jorge Villarreal" }
      - type: { target: demo-radio, text: "La Ranchera 98.3" }
      - type: { target: demo-ciudades, text: "McAllen 98.3 FM, Harlingen 104.5 FM" }
        say: Deja su nombre, su radio y sus ciudades, y el equipo le arma la demo con su señal.
      - highlight: demo-enviar
