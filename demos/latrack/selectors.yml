  # ── inbox (/inbox) ────────────────────────────────────────────────────────
  inbox-pedido-lupita:    'main :text("¿Me ponen algo de Carin León para mi mamá?")'

  # ── the listener app (Radio Sol, web build of the real app) ───────────────
  app-oyente-home:        '[data-testid="hero-play"]'
  app-ciudad:             '[data-testid="city-picker"]'
  app-ciudad-el-paso:     '[data-testid^="city-option-"]:has-text("El Paso")'
  app-play:               '[data-testid="hero-play"]'
  app-tab-programas:      '[data-testid="tab-programas"]'
  app-programa:           '[data-testid="schedule-slot"]:has-text("El Despertador Ranchero")'
  app-tab-cabina:         '[data-testid="tab-cabina"]'
  app-pedido:             '[data-testid="studio-kind-REQUEST"]'
  app-nombre-oyente:      '[data-testid="studio-name"]'
