  usar-bundle-sugerido:   'role=button[name="Usar este"]'
  app-guardar:            'role=button[name="Crear app"]'
  checklist-completo:     'text=Todo listo para publicar.'
  boton-compilar:         'aside button:has(svg.lucide-rocket)'

  # ── push (/push) ──────────────────────────────────────────────────────────
  nav-push:               'nav a[href="/push"]'
  push-form:              'form:has(#body) #title'
  push-titulo:            'form:has(#body) #title'
  push-cuerpo:            'form:has(#body) #body'
  push-por-senal:         'role=button[name="Por señal o ciudad"]'
  push-odessa:            'label:has-text("Radio Sol 105.1 Odessa") input[type="checkbox"]'
