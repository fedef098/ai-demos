# The ONLY file with selectors for the Latrack demos.
#
# The console has almost no data-testid, so these lean on ids, roles with their
# Spanish names (the demo runs with locale es-US, so the console is in Spanish)
# and a few structural anchors. Role names match as a case-insensitive
# substring unless they end in `s` ("Programar"s ≠ "Programar envío").
# The listener app (React Native web) does carry data-testid (RN's testID).
targets:
  # ── the invitation email (fixture: Latrack's real template) ───────────────
  correo-invitacion:      'h1:has-text("Te invitaron a la consola de Radio Sol")'
  correo-aceptar:         'a:text-is("Aceptar invitación")'

  # ── invitation and dashboard ──────────────────────────────────────────────
  invitacion-form:        'form:has(#name):has(#password)'
  invitacion-nombre:      '#name'
  invitacion-password:    '#password'
  invitacion-aceptar:     'role=button[name="Aceptar y entrar"]'
  inicio-checklist:       'h2:has-text("Pon tu app en el aire")'
  paso-marca:             'a:has-text("Sube el logo y los colores de tu marca")'

  # ── brand (/brands → /brands/new) ─────────────────────────────────────────
  marcas-vacio:           'main >> role=link[name="Crear marca"]'
  marca-form:             'form:has(#slogan):has(#primaryColor)'
  marca-nombre:           '#name'
  marca-slogan:           '#slogan'
  marca-descripcion:      '#description'
  marca-logo:             'div:has(> input[name="logoUrl"]) > input[type="file"]'
  marca-logo-listo:       'div:has(> input[name="logoUrl"]) button img'
  marca-color:            '#primaryColor'
  marca-acento:           '#accentColor'
  telefono-preview:       'aside .rounded-device'
  marca-guardar:          'role=button[name="Crear marca"]'
  marca-guardada:         'a[href^="/brands/"][href$="/home"]'

  # ── stations (/stations → /stations/new) ──────────────────────────────────
  nav-senales:            'nav a[href="/stations"]'
  senales-agregar:        'main >> role=link[name="Agregar señal"]'
  senal-form:             'form:has(#whatsappNumber)'
  senal-nombre:           '#name'
  senal-ciudad:           '#city'
  senal-estado:           '#region'
  senal-zona:             '#timezone'
  senal-stream:           'input[aria-label="URL del stream"]'
  senal-probar:           'role=button[name="Probar"]'
  senal-probar-ok:        '[role="status"]:has-text("Funciona"):not(:has-text("No funciona"))'
  senal-whatsapp:         '#whatsappNumber'
  senal-frecuencia:       '#freq-0'
  senal-guardar:          'role=button[name="Crear señal"]'
  senal-error-frecuencia: '[role="alert"]:has-text("no es una frecuencia FM")'
  # The saved station's page: the number typed locally comes back with its +1.
  senal-guardada:         'input#whatsappNumber[value="+1 915 555 0123"]'
  senal-odessa-guardada:  'input#name[value="Radio Sol 105.1 Odessa"]'

  # ── schedule (/schedule) ──────────────────────────────────────────────────
  nav-programacion:       'nav a[href="/schedule"]'
  grilla:                 'role=button[name="Agregar horario"]'
  nuevo-programa:         'role=button[name="Nuevo programa"]'
  show-form:              'dialog[open] #hosts'
  show-nombre:            'dialog[open] #name'
  show-locutores:         'dialog[open] #hosts'
  show-crear:             'dialog[open] >> role=button[name="Crear programa"]'
  show-creado:            'li:has-text("El Despertador Ranchero"):has-text("Lupita Arredondo")'
  agregar-horario:        'role=button[name="Agregar horario"]'
  slot-form:              'dialog[open] #showId'
  slot-programa:          'dialog[open] #showId'
  slot-lunes-a-viernes:   'dialog[open] >> role=button[name="Lunes a viernes"]'
  slot-inicio:            'dialog[open] #start'
  slot-fin:               'dialog[open] #end'
  slot-guardar:           'dialog[open] >> role=button[name="Agregar en 5 días"]'
  slot-en-grilla:         'button[aria-label^="El Despertador Ranchero, Lunes"]'
  copiar-grilla:          'role=button[name="Copiar programación a otra señal"]'
  copia-destino:          'dialog[open] #toId'
  copia-confirmar:        'dialog[open] >> role=button[name="Copiar programación"]'
  copia-confirmada:       'dialog[open] [role="status"]:has-text("ahora tiene los")'
  selector-senal:         '#station-picker'
  grilla-odessa:          'p:has-text("Ahora son las"):has-text("Odessa")'

  # ── home editor (/brands/<id>/home) ───────────────────────────────────────
  home-editor:            'role=button[name="Publicar"]'
  agregar-bloque:         'role=button[name="Agregar bloque"]'
  bloque-ciudades:        'li button:has(span:text-is("Ciudades"))'
