  bloque-programas-nuevo: 'section[aria-label="Bloques"] li:has-text("Programas")'
  home-momento:           'select[aria-label="Momento de la vista previa"]'
  home-hora:              'input[aria-label="Hora"]'
  home-al-aire:           'section[aria-label="Vista previa"] :text("El Despertador Ranchero")'
  home-publicar:          'role=button[name="Publicar"]'
  home-publicada:         'text=Publicada. Los oyentes la ven la próxima vez que abran la app.'

  # ── store listing (/apps → /apps/new → /apps/<id>) ────────────────────────
  nav-apps:               'nav a[href="/apps"]'
  apps-nueva:             'main >> role=link[name="Crear app"]'
  app-form:               'form:has(#storeDescription)'
  app-nombre:             'form:has(#storeDescription) #name'
  app-icono:              'div:has(> input[name="iconUrl"]) > input[type="file"]'
  app-icono-listo:        'div:has(> input[name="iconUrl"]) button img'
