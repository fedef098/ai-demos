  bloque-programas-nuevo: 'section[aria-label="Bloques"] li:has-text("Programas")'
  home-momento:           'select[aria-label="Momento de la vista previa"]'
  home-hora:              'input[aria-label="Hora"]'
  home-al-aire:           'section[aria-label="Vista previa"] :text("El Despertador Ranchero")'
  home-publicar:          'role=button[name="Publicar"]'
  home-publicada:         'text=Publicada. Los oyentes la ven la próxima vez que abran la app.'

  # ── store listing (/apps → /apps/new → /apps/<id>) ────────────────────────
  nav-apps:               'nav a[href="/apps"]'
  apps-nueva:             'main >> role=link[name="Crear app"]'
  app-form:               'form:has(#storeDescription)'
  app-nombre:             'form:has(#storeDescription) #name'
  app-icono:              'div:has(> input[name="iconUrl"]) > input[type="file"]'
  app-icono-listo:        'div:has(> input[name="iconUrl"]) button img'
  app-descripcion:        '#storeDescription'
  app-soporte:            '#supportEmail'
  app-privacidad:         '#privacyUrl'
  usar-bundle-sugerido:   'role=button[name="Usar este"]'
  app-guardar:            'role=button[name="Crear app"]'
  checklist-completo:     'text=Todo listo para publicar.'
  boton-compilar:         'aside button:has(svg.lucide-rocket)'

  # ── push (/push) ──────────────────────────────────────────────────────────
  nav-push:               'nav a[href="/push"]'
  push-form:              'form:has(#body) #title'
  push-titulo:            'form:has(#body) #title'
  push-cuerpo:            'form:has(#body) #body'
  push-por-senal:         'role=button[name="Por señal o ciudad"]'
  push-odessa:            'label:has-text("Radio Sol 105.1 Odessa") input[type="checkbox"]'
  push-programar:         'role=button[name="Programar"s]'
  push-cuando:            '#scheduledAt'
  push-sale:              'p:has-text("Sale el")'
  push-enviar:            'role=button[name="Programar envío"]'
