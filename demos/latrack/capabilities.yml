# What Latrack can do, for the demo catalog. One capability = something a radio
# owner would ask to see, not a screen. Ids are stable: the scripts' `covers:`
# point at them. `priority` is how costly it is NOT to be able to show it.
product: Latrack

capabilities:
  # ── Onboarding ──────────────────────────────────────────────────────────────
  - id: invitacion
    title: "El dueño entra con una invitación, sin instalar nada ni hablar con ventas"
    area: Onboarding
    priority: alta

  - id: marca
    title: "Logo, colores y lema, con la app en un teléfono que cambia al instante"
    area: Onboarding
    priority: alta

  # ── Señales ─────────────────────────────────────────────────────────────────
  - id: senales
    title: "Cada FM o AM de la radio, con su ciudad, su zona horaria y el WhatsApp de cabina"
    area: Señales
    priority: alta

  - id: stream-probe
    title: "El stream se prueba en el momento y dice qué está sonando"
    area: Señales
    priority: media

  - id: validacion-amigable
    title: "Los errores se explican en palabras simples y el formulario no pierde nada"
    area: Señales
    priority: media

  # ── Programación ────────────────────────────────────────────────────────────
  - id: programacion
    title: "La grilla semanal se carga una vez, de lunes a viernes, y la app sabe quién está al aire"
    area: Programación
    priority: alta

  - id: copiar-grilla
    title: "La grilla de una ciudad se copia a otra respetando la hora local"
    area: Programación
    priority: media

  # ── App ─────────────────────────────────────────────────────────────────────
  - id: home-editor
    title: "La pantalla de inicio se arma por bloques y se publica sin pasar por la tienda"
    area: App
    priority: alta

  - id: ficha-tienda
    title: "La ficha de App Store y Google Play, con checklist, publicada a nombre de la radio"
    area: App
    priority: alta

  - id: app-oyente
    title: "La app del oyente con la marca de la radio: ciudad, en vivo, programación y cabina"
    area: App
    priority: alta

  - id: reproductor-web
    title: "Un reproductor web con la marca de la radio, listo desde el primer día"
    area: App
    priority: media

  # ── Not covered by any demo yet ────────────────────────────────────────────
  - id: estadisticas
    title: "Oyentes en vivo, horas escuchadas y AQH por programa y por ciudad"
    area: Audiencia
    priority: alta

  - id: sponsors
    title: "Sponsors con banners y pre-rolls, segmentados por programa y con tope por oyente"
    area: Ingresos
    priority: alta

  - id: reporte-sponsor
    title: "Un reporte para el sponsor con impresiones y clics, listo para mandar"
    area: Ingresos
    priority: media

  - id: reels
    title: "Reels verticales con la marca de la radio, armados desde el aire"
    area: Contenido
    priority: media

  - id: mensajes-cabina
    title: "Los mensajes y pedidos de canciones de los oyentes llegan a una bandeja de cabina"
    area: Audiencia
    priority: media

  - id: concursos
    title: "Concursos y encuestas dentro de la app, con sus participantes"
    area: Audiencia
    priority: media

  - id: push
    title: "Notificaciones push a los oyentes, por ciudad"
    area: Audiencia
    priority: media

  - id: consola-ingles
    title: "La consola en inglés, por usuario, para el equipo que no habla español"
    area: Plataforma
    priority: baja

  # ── Module demos (marca, senales-streams, programacion, home-app, apps-tiendas) ──
  - id: kit-reels
    title: "Un kit de marca para reels: fuentes, subtítulos y logo, igual para todo el equipo"
    area: Contenido
    priority: media

  - id: frecuencias-am-fm-hd
    title: "AM, FM y canales HD que transmiten lo mismo, en una sola señal"
    area: Señales
    priority: media

  - id: stream-respaldo
    title: "Streams de respaldo: si el principal se cae, la app pasa sola al siguiente"
    area: Señales
    priority: alta

  - id: estado-stream
    title: "El estado de cada stream y las canciones que sonaron, leídas del aire"
    area: Señales
    priority: media

  - id: home-horario
    title: "Bloques de la home con horario: un aviso solo el fin de semana, una promo hasta una fecha"
    area: App
    priority: media

  - id: home-versiones
    title: "Cada publicación de la home queda guardada y se puede restaurar"
    area: App
    priority: media

  - id: anuncios-reglas
    title: "Reglas del pre-roll que protegen al oyente, con avisos cuando una opción lo espanta"
    area: Ingresos
    priority: alta

  # ── Added by the module videos (mensajes-cabina … pagina-producto) ──────────
  - id: equipo
    title: "Equipo con roles (administrador, editor por marca), invitaciones y registro de actividad"
    area: Plataforma
    priority: media

  - id: pagina-producto
    title: "Una página pública que explica el producto, sus precios y pide la demo"
    area: Ventas
    priority: media

  # ── Batch nov 2026: the single Latrack app, Tu radio en Latrack, promo and sales ──
  - id: app-latrack-link
    title: "El link de la radio abre la app Latrack directo en ella, con su marca"
    area: App
    priority: alta

  - id: app-latrack-buscador
    title: "Sin link, el oyente encuentra la radio por nombre, ciudad, frecuencia o cerca de él"
    area: App
    priority: alta

  - id: app-latrack-mis-radios
    title: "El oyente sigue varias radios y cambia entre ellas; cada una con su logo y sus colores"
    area: App
    priority: media

  - id: latrack-link-qr
    title: "Link directo y QR de la radio, sin cuentas de Apple ni Google ni revisiones de tienda"
    area: App
    priority: alta

  - id: latrack-buscador
    title: "La radio decide si aparece en el buscador de Latrack; el link funciona igual"
    area: App
    priority: media

  - id: latrack-vista-previa
    title: "Vista previa de cómo ven la radio sus oyentes en Latrack"
    area: App
    priority: media

  - id: latrack-funciones
    title: "Funciones para oyentes que se prenden y apagan sin versión nueva de la app"
    area: App
    priority: media

  - id: promo-campanas
    title: "Una campaña por cada lugar donde se promociona la radio, con su link y su QR"
    area: Crecimiento
    priority: alta

  - id: promo-guiones
    title: "Guiones para el locutor de 10, 20 y 30 segundos, en español y en inglés"
    area: Crecimiento
    priority: media

  - id: promo-resultados
    title: "Toques, visitas al reproductor, instalaciones y aperturas por campaña"
    area: Crecimiento
    priority: alta

  - id: paquetes
    title: "Paquetes de menciones, pre-roll, banner y push con precio sugerido, y su entrega en el reporte"
    area: Ingresos
    priority: alta

  - id: propuestas
    title: "Propuesta comercial con los banners del anunciante en la app, en PDF o link de solo lectura"
    area: Ingresos
    priority: alta

  - id: push-patrocinado
    title: "Push «Presentado por» un sponsor, uno por día como máximo"
    area: Ingresos
    priority: media

  # ── Batch 2 (nov 2026) ──────────────────────────────────────────────────────
  - id: alertas-stream
    title: "Alertas por email si el stream se cae o queda en silencio, con minutos, destinatarios y horario de silencio"
    area: Señales
    priority: alta

  - id: retencion
    title: "Retención: cuánto se quedan, quién se va rápido por programa y las canciones con más salidas"
    area: Audiencia
    priority: alta

  - id: me-lo-perdi
    title: "Me lo perdí: segmentos de charla publicados para escuchar en la app y volver al vivo"
    area: Contenido
    priority: media

  - id: cabina-voz-foto
    title: "Notas de voz y fotos de los oyentes a la cabina, con switches por radio"
    area: Audiencia
    priority: media

  - id: concursos-consentimiento
    title: "Sorteos con consentimiento obligatorio, participantes y CSV"
    area: Audiencia
    priority: media

  - id: pagina-web
    title: "Página web pública de la radio, armada sola y ordenada desde la consola"
    area: App
    priority: alta
