# yaml-language-server: $schema=../../plugins/demofed/skills/demofed/templates/demo.schema.json
id: secrets-vault-own-keys
product: BlueButterfly
archetype: crud
title: Every owner's secrets now sit under a key of their own
promise: >
  The vault looks the same, but each owner's secrets are sealed with their own
  key and bound to the row they live in.
titleCard: false

intake:
  audience: >
    Internal team (devs and product). They know the vault shipped on 11-23 and
    need to see what changed underneath on 11-24 and that nothing changed for
    the user. Video goes up to efetrack as an update.
  in:
    - adding a secret and reading it back, as the owner
    - the views log
    - a trusted contact opening a shared secret
    - a value copied onto another row refusing to open (the proof of the change)
    - an older secret that was moved onto the owner's key without anyone noticing
  out:
    - master key rotation — env vars and a redeploy, nothing on screen; told in the closing line
    - KMS — not built
    - the email the owner gets when a contact views a secret — another inbox, not this screen
    - 2FA before a reveal — off in production, Manuel owns it
  environment: QA (qa-app.bluebutterfly.com), two +test accounts the seed creates; the tampered row is written by the seed on QA
  approved_by: Federico, 2026-11-24

viewport: desktop
locale: en-US
narration:
  voice: af_heart
  lang: a
timezone: America/New_York
# No freezeTime: the delegated plan view never settles under a frozen clock.

cast:
  - as: owner
    name: Maria Sanchez
    context: 68, Tampa. Putting her affairs in order so her son is not left guessing.
    auth: { via: storageState, file: ./seeds/.state/owner.json }

  - as: contact
    name: Sam Sanchez
    context: Maria's son and trusted contact. She let him see secrets, now.
    auth: { via: storageState, file: ./seeds/.state/contact.json }

world:
  seed: ./seeds/secrets-vault-own-keys.mjs
  assert:
    - Maria has three secrets — Home Wi-Fi (shared now), Old router (the Wi-Fi's sealed value copied onto it), Netflix (written before the change)
    - Sam is Maria's trusted contact, identity verified, allowed to see secrets now

# Replaces the default list, so the defaults are repeated here.
hide: ["nextjs-portal", "[data-nextjs-toast]", "#crisp-chatbox", '[data-testid="support-launcher"]']
# The contact's email on the plan recap is the team's real mailbox.
redact: ['[data-testid="user-email"]', 'svg.lucide-mail + span']

scenes:
  - id: alta
    title: "A secret goes in the way it always did"
    proves: Nothing changed for the owner; the value is sealed with her own key on save.
    covers: [vault-add, vault-own-key]
    watch: Her first secret is what mints her key. No setup, no new screen.
    beats:
      - as: owner
        go: /settings/secrets
        awaits: secrets-list
        say: Maria keeps the passwords her son will need in one place.
      - click: secrets-add
        awaits: secret-form
      - type: { target: secret-form-title, text: "Chase checking" }
      - type: { target: secret-form-username, text: "maria.sanchez" }
      - type: { target: secret-form-secret, text: "Tampa-Sunset-1957" }
      - click: secret-form-save
        awaits: secrets-row
        say: On save it is sealed with a key that belongs to Maria alone.

  - id: leer
    title: "Only names in the list, the value on demand"
    proves: Lists never carry a value; a reveal opens it for 60 seconds and logs it.
    covers: [vault-reveal, vault-views-log]
    watch: The row shows a name only; the value comes from a separate, logged request.
    beats:
      - click: chase-show
        awaits: secret-revealed
        say: She opens it for a minute. Then it hides itself again.
      - scroll: secrets-views
        awaits: secrets-views
        say: And every look is on record, hers included.

  - id: contacto
    title: "Her son sees what she chose to share"
    proves: The double filter still holds with per-owner keys.
    covers: [vault-contact-reveal]
    watch: Same rules as yesterday. The key change is invisible to the contact too.
    beats:
      - as: contact
        # Maria's QA user id: the engine does not expand ${VARS} in `go`. The seed
        # reuses her account, so it only changes if that account is deleted.
        go: /plan?sharedWith=dfef6a17-77cf-44c8-9498-7d4f0fd5ea5a
        wait: 6s
        say: Sam, her son, opens his mother's plan from his own account.
      - scroll: shared-secrets-panel
        awaits: shared-secrets-panel
        say: Sam sees only the Wi-Fi, the one secret Maria shared with him now.
      - click: shared-secrets-row-show
        awaits: secret-revealed
        say: He opens it, and Maria's log gets a line with his name.

  - id: copiado
    title: "A value moved to another row does not open"
    objection: true
    proves: Each value is bound to its row and column; another row or owner's key cannot open it.
    covers: [vault-row-binding]
    watch: The seed copied the Wi-Fi's sealed value onto the Old router row in the database. Before 11-24 a copied value would have opened.
    hold: 2s
    beats:
      - as: owner
        go: /settings/secrets
        awaits: secrets-list
        say: Someone with database access copies one sealed value onto another row.
      - click: old-router-show
        awaits: reveal-error
        say: It refuses to open. A value only opens where it was written.

  - id: migracion
    title: "Older secrets moved over on their own"
    proves: At boot the API reseals values from the app-wide key onto the owner's key.
    covers: [vault-migration]
    watch: Netflix was written before the change. Nobody re-entered it.
    beats:
      - click: netflix-show
        awaits: secret-revealed
        say: Netflix was saved before the change, and it opens like nothing happened.
        hold: 3s
      - scroll: secrets-list
        say: Rotating the master now rewraps one key per owner, never the secrets.
