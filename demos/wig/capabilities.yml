# demos/capabilities.yml — el inventario de lo que el producto SABE hacer.
#
# No describe demos: describe capacidades. El catálogo
# (`node skills/product-demo/templates/runner/catalog.mjs demos/wig`) cruza esta
# lista contra los guiones (`covers:`) y las grabaciones, y clasifica cada
# capacidad en cubierta / guionada / sin cubrir. Los ids son estables: son lo
# que referencian los guiones.
#
# Alcance de este archivo: Memorial Pages. Cuando se guionen otras secciones de
# When I Go (plan builder, trusted contacts, documentos, April), sus capacidades
# se agregan acá con su propia `area`.

product: When I Go

capabilities:
  # ── Crear la página ─────────────────────────────────────────────────────────
  - id: memorial-create-own
    title: "Alguien crea, en vida, la página que se va a leer cuando no esté"
    area: Memorial Pages
    priority: alta

  - id: memorial-create-for-someone
    title: "Una familia crea la página de alguien que ya murió"
    area: Memorial Pages
    priority: alta

  - id: memorial-prefill-from-plan
    title: "La página arranca con lo que la persona ya escribió en su plan"
    area: Memorial Pages
    priority: alta

  - id: memorial-plan-sync-auto
    title: "La página sigue al plan: lo que cambia allá aparece acá"
    area: Memorial Pages
    priority: alta

  - id: memorial-plan-sync-manual
    title: "Sin sincronía automática, cada sección se trae del plan a pedido"
    area: Memorial Pages
    priority: media

  # ── Cómo se ve y qué dice ───────────────────────────────────────────────────
  - id: memorial-themes
    title: "Se elige entre decenas de diseños y la página no parece un formulario"
    area: Memorial Pages
    priority: alta

  - id: memorial-details
    title: "Nombre, fechas y titular son de la persona, no de una plantilla"
    area: Memorial Pages
    priority: media

  - id: memorial-life-story
    title: "La historia de vida se edita como texto propio, no como campos"
    area: Memorial Pages
    priority: alta

  - id: obituary-assistant
    title: "Un asistente convierte unas respuestas en un borrador de obituario"
    area: Memorial Pages
    priority: alta

  - id: memorial-photos-group
    title: "Las fotos de la página son un grupo aparte del resto del plan"
    area: Memorial Pages
    priority: alta

  - id: memorial-song
    title: "La página suena: la canción elegida se reproduce ahí mismo"
    area: Memorial Pages
    priority: media

  - id: memorial-documents
    title: "Se adjuntan documentos y programas para descargar desde la página"
    area: Memorial Pages
    priority: baja

  # ── Publicación y visitantes ────────────────────────────────────────────────
  - id: memorial-publish
    title: "Se publica y queda un link que cualquiera abre sin cuenta"
    area: Memorial Pages
    priority: alta

  - id: memorial-public-page
    title: "El visitante ve la página completa: historia, fotos y canción"
    area: Memorial Pages
    priority: alta

  - id: memorial-unlisted
    title: "La página se mantiene fuera de buscadores mientras se arma"
    area: Memorial Pages
    priority: media

  - id: memorial-tribute-post
    title: "Un vecino deja un recuerdo sin instalar ni registrarse en nada"
    area: Memorial Pages
    priority: alta

  - id: memorial-tribute-moderation
    title: "Nada aparece en la página hasta que la familia lo aprueba"
    area: Memorial Pages
    priority: alta

  - id: memorial-tribute-video
    title: "Un tributo puede ser un video, no sólo un texto"
    area: Memorial Pages
    priority: media

  # ── Servicio y organización ─────────────────────────────────────────────────
  - id: memorial-services
    title: "El velorio y el servicio quedan publicados con fecha, hora y mapa"
    area: Memorial Pages
    priority: alta

  - id: memorial-guests
    title: "Se invita por mail y se sabe quién dijo que va"
    area: Memorial Pages
    priority: media

  - id: memorial-rsvp
    title: "El invitado confirma asistencia desde la página pública"
    area: Memorial Pages
    priority: media

  - id: memorial-tasks
    title: "Las tareas de esos días se reparten entre quienes ofrecieron ayuda"
    area: Memorial Pages
    priority: media

  - id: memorial-donations
    title: "En vez de flores, la página recibe donaciones a donde la familia pidió"
    area: Memorial Pages
    priority: media
