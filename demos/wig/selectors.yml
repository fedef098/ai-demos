# demos/selectors.yml — el ÚNICO archivo con selectores.
#
# El guion (.demo.yml) no tiene ni uno: apunta a los nombres de acá. Así un PR
# que toca el relato y uno que toca el mantenimiento son PRs distintos.
#
# Prioridad al elegir un selector:
#   1. data-testid          estable, explícito, sobrevive a un rediseño
#   2. role + name          semántico; se rompe si cambia el copy
#   3. texto                último recurso
#
# PROHIBIDO nth-child y XPath.
#
# ⚠ `highlight` corre document.querySelector() dentro de la página: esos targets
#   tienen que ser CSS plano, nunca `role=` ni `text=`. `click` y `awaits` usan
#   locators de Playwright, donde `role=`/`text=` sí valen.

targets:
  # ── listado y creación ─────────────────────────────────────────────────────
  memorial-create-button:      '[data-testid="memorial-create-button"]'
  memorial-create-modal:       '[data-testid="memorial-create-modal"]'
  memorial-subject-self:       '[data-testid="memorial-subject-self"]'
  memorial-subject-prefill:    '[data-testid="memorial-subject-prefill"]'
  memorial-create-confirm:     '[data-testid="memorial-create-confirm"]'
  memorial-card-link:          '[data-testid="memorial-card-link"]'

  # ── pasos del editor ───────────────────────────────────────────────────────
  # Ya no son los círculos de un stepper: cada paso es una sub-fila del sidebar
  # y vive en la URL (`/memorials/<id>/<step>`). La sección Memorial se expande
  # sola al entrar a la ruta —un efecto la abre cuando el pathname empieza con
  # /memorials—, así que no hace falta un beat que despliegue el chevron.
  step-details:                '[data-testid="sidebar-menu-item-memorial-details"]'
  step-story:                  '[data-testid="sidebar-menu-item-memorial-story"]'
  step-photos:                 '[data-testid="sidebar-menu-item-memorial-photos"]'
  step-song:                   '[data-testid="sidebar-menu-item-memorial-song"]'
  step-publish:                '[data-testid="sidebar-menu-item-memorial-publish"]'
  step-tributes:               '[data-testid="sidebar-menu-item-memorial-tributes"]'

  # Lo que se espera después de crear o de abrir un memorial es el CONTENIDO del
  # primer paso, no su fila del menú: la fila la pinta el sidebar apenas la URL
  # cambia, mientras el panel todavía está cargando. Esperar la fila devolvería
  # el control con la pantalla a medio armar.
  theme-step-loaded:           '[data-testid="memorial-theme-display-prefs"]'

  # ── tema ───────────────────────────────────────────────────────────────────
  # Dos condiciones para que este click sea un click y nada más:
  #  · Cada categoría es un carrusel horizontal y monta todas sus tarjetas, así
  #    que el tema existe en el DOM apenas carga el paso; si cae fuera de la
  #    parte visible del riel, el click lo scrollea solo.
  #  · No trae `heroImage`. Un tema que sí lo trae abre un ConfirmationModal
  #    ("este tema tapa tu foto de portada") que hay que responder, y además
  #    dejaría el retrato de Marion fuera de la portada.
  theme-sky-purple:            '[data-testid="memorial-theme-sky-purple"]'
  theme-sky-purple-selected:   '[data-testid="memorial-theme-sky-purple"][aria-pressed="true"]'

  # ── detalles ───────────────────────────────────────────────────────────────
  full-name-input:             '[data-testid="memorial-full-name-input"]'
  headline-input:              '[data-testid="memorial-headline-input"]'
  plan-sync-auto-card:         '[data-testid="memorial-plan-sync-auto"]'

  # ── historia, fotos y canción ──────────────────────────────────────────────
  biography-editor:            '[data-testid="memorial-biography-editor"]'
  photos-tab-gallery:          '[data-testid="memorial-photos-tab-gallery"]'
  photos-tab-plan:             '[data-testid="memorial-photos-tab-plan"]'
  # La baldosa del plan cambia de testid según esté o no en la página, así que
  # esperar `-added` es la prueba de que la foto cruzó, no un nombre distinto
  # para lo mismo.
  plan-photo-added:            '[data-testid="memorial-plan-photo-added"]'
  songs-tab-page:              '[data-testid="memorial-songs-tab-page"]'

  # ── publicación ────────────────────────────────────────────────────────────
  publish-button:              '[data-testid="memorial-publish"]'
  unpublish-button:            '[data-testid="memorial-unpublish"]'

  # ── página pública ─────────────────────────────────────────────────────────
  public-hero:                 '[data-testid="memorial-hero"]'
  public-songs:                '[data-testid="memorial-public-songs"]'
  public-tribute-card:         '[data-testid="memorial-tribute-card"]'

  # ── tributos ───────────────────────────────────────────────────────────────
  tribute-open:                '[data-testid="memorial-share-tribute-open"]'
  tribute-name-input:          '#tribute-name'
  # Los temas de la familia `sky` usan la grilla ancha de Blue Butterfly, donde
  # el muro ES la banda de condolencias: no tiene solapas y sólo muestra las
  # tributos de tipo `condolence`. Un `memory` de texto quedaría aprobado y sin
  # aparecer en ningún lado, así que el tipo se elige explícitamente.
  tribute-type-select:         '#tribute-type'
  tribute-message-input:       '#tribute-message'
  tribute-submit:              'role=button[name="Share tribute"]'
  tribute-pending-notice:      'text=Your tribute will appear once the family approves it.'
  tribute-approve:             'role=button[name="Approve"]'
  tributes-empty-bucket:       '[data-testid="memorial-tributes-empty-bucket"]'
