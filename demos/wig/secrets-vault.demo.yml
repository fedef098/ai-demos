# yaml-language-server: $schema=../../plugins/demofed/skills/demofed/templates/demo.schema.json
id: secrets-vault
product: BlueButterfly
archetype: crud
title: The secrets vault, from the owner to the family
titleCard: false
promise: >
  Maria keeps the passwords and account details her family will need in one encrypted
  place, mentions them where they matter, and decides who can open each one and when.

intake:
  audience: >
    The Adavance team and the client, in efetrack (BlueButterfly → Secrets vault): how the
    whole vault module works today.
  in:
    - Settings → Secrets with three secrets (shared now, after death, private) and the view history
    - Adding a secret in the modal, shared now
    - Showing a value (the second factor is already passed in the seeded session)
    - Important Notes, typing @ and clicking a secret to mention it, and the Secrets tab
    - Lucas (trusted contact allowed to see secrets) opening the one shared with him
    - Ana (trusted contact without the permission) seeing the tag but nothing to open
  out:
    - The 60-second auto-hide (not waited for on camera)
    - The email code prompt (the seeded sessions already passed the second factor)
    - Encryption internals (covered by the secrets-vault-own-keys demo)
  environment: >
    QA (https://qa-app.bluebutterfly.com), account federicofiorottowork+vaultdemo+test (Maria
    Lopez, premium) with contacts Lucas (+vaultdemocontact+test) and Ana (+vaultdemonoaccess+test).
    The seed rebuilds her secrets, the note and Lucas's view on every run.
  approved_by: "Federico, 2026-11-25 (script with the @ click, no 60s wait, no captions, Latrack pace)"

viewport: desktop
locale: en-US
timezone: America/New_York
narration:
  voice: af_heart
  lang: a
pace: medium
captions: false
chapter: { position: top-right, top: 80 }

hide:
  - '[data-testid="support-launcher"]'
  - '#CybotCookiebotDialog'
redact:
  - '[data-testid="user-email"]'
  - 'svg.lucide-mail + span'
  - '[data-testid="memorial-personal-info-email"] [data-testid="memorial-personal-info-email-subtitle"]'
  - '[data-testid="memorial-personal-info-email"]'

cast:
  - as: maria
    name: Maria Lopez
    context: Plans ahead so her children won't have to hunt for passwords.
    auth: { via: storageState, file: ./seeds/.state/vault-maria.json }
  - as: lucas
    name: Lucas Lopez
    label: "Lucas · Maria's son"
    context: Her trusted contact, allowed to see the secrets she shares.
    auth: { via: storageState, file: ./seeds/.state/vault-lucas.json }
  - as: ana
    name: Ana Lopez
    label: "Ana · Maria's sister"
    context: Also a trusted contact, but not allowed to see secrets.
    auth: { via: storageState, file: ./seeds/.state/vault-ana.json }

world:
  seed: ./seeds/secrets-vault.mjs
  assert:
    - Maria has Chase checking (shared now), Home Wi-Fi (after death) and Personal Gmail (only her)
    - Lucas already viewed Chase checking

scenes:
  - id: vault
    title: "Everything in one encrypted place"
    proves: Settings → Secrets lists names only, each with who it is shared with.
    covers: [vault-add]
    watch: The list never carries a value; each row says if it is private, shared now or after death.
    beats:
      - as: maria
        go: /plan/dashboard
        awaits: plan-home
        say: Maria keeps the passwords her family will need in one place.
      - click: user-menu
        awaits: user-menu-settings
      - click: user-menu-settings
        awaits: settings-secrets
        say: From her plan, it is one click away in Settings.
      - click: settings-secrets-open
        awaits: vault-card
      - say: It is encrypted with a key that is hers alone.
      - hover: vault-card
        say: The list shows names only. Each one says who can see it, and from when.

  - id: add
    title: "Shared on purpose"
    proves: A secret is added in a modal; sharing is an explicit choice, now or after her death.
    covers: [vault-add]
    watch: Required and optional fields are marked; sharing starts off.
    beats:
      - click: secrets-add
        awaits: secret-form
        say: She adds the card her son uses for the groceries.
      - type: { target: secret-form-title, text: "American Express" }
      - type: { target: secret-form-username, text: "maria.lopez" }
      - type: { target: secret-form-secret, text: "Coral-Reef-2031" }
      - click: vault-form-shared
        say: Sharing is a choice she makes for each secret, now or only after her death.
      - click: vault-form-timing-now
      - click: secret-form-save
        awaits: vault-amex-row
        say: This one, her son can open from today.

  - id: show
    title: "A value, only when asked for"
    proves: Showing a value needs a recent second factor, hides itself, and every look is recorded.
    covers: [vault-reveal, vault-views-log]
    watch: The session already passed the second factor; otherwise a code is asked first.
    beats:
      - click: vault-chase-show
        awaits: secret-revealed
        say: A value only shows when she asks for it, and it hides itself again after a minute.
      - scroll: vault-views-contact
        awaits: vault-views-contact
        say: And every look is on record. Here is the day Lucas opened the bank login.

  - id: notes
    title: "Mentioned right where it matters"
    proves: In an Important Note, typing @ lists her secrets and a click drops one into the text as a tag.
    covers: [vault-mentions, vault-notes-tab]
    watch: The note keeps the name only; the value stays in the vault.
    beats:
      - go: /plan/builder?step=important_notes
        awaits: notes-add
        say: Her notes say what to do. Now they can point at the right password.
      - click: notes-add
        awaits: notes-editor
      - type: { target: notes-title, text: "Online orders" }
      - type: { target: notes-editor, text: "The card for the online orders is @Am" }
        awaits: notes-mention-menu
        say: She types an at sign, and her secrets appear.
      - click: notes-mention-amex
        awaits: notes-mention-chip
        say: One click, and the card is in the note. Only its name, never the number.
      - click: notes-save
        awaits: notes-secrets-tab
      - click: notes-secrets-tab
        awaits: notes-secret-tile
        say: And all her secrets sit right next to her notes.

  - id: family
    title: "Her son sees what she chose"
    proves: A trusted contact allowed to see secrets gets only the ones shared with him now.
    covers: [vault-contact-reveal]
    watch: The Wi-Fi is shared after her death, so it does not appear yet.
    beats:
      - as: lucas
        go: /plan?sharedWith=484c2ee7-9038-4a4f-bd62-a41ad508f297
        awaits: recap-secrets
        say: Lucas, her son, opens his mother's plan from his own account.
      - click: recap-chase-show
        awaits: secret-revealed
        say: He sees only what she shared with him today.
      - say: And Maria's history gets a line with his name.

  - id: no-access
    title: "A tag is not a key"
    objection: true
    proves: A contact without the permission sees the mention's name in a note, and has nothing to open.
    covers: [vault-no-access]
    watch: No Secrets panel for Ana, and the API answers 404 to her for every secret.
    hold: 2s
    beats:
      - as: ana
        go: /plan?sharedWith=484c2ee7-9038-4a4f-bd62-a41ad508f297
        awaits: recap-notes
        say: Ana is a trusted contact too, but Maria never let her see secrets.
      - scroll: recap-note-tag
        awaits: recap-note-tag
        say: She can read the note and see which secret it means. There is nothing for her to open.
